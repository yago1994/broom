<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Broom — Options</title>
    <style>
      body { font: 14px -apple-system, system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; color: #111; }
      h1 { font-size: 18px; }
      label { display: block; margin: 14px 0 4px; font-weight: 600; }
      input, select, textarea { font: inherit; width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
      .row { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
      button { font: inherit; padding: 6px 12px; border: 1px solid #2563eb; background: #2563eb; color: #fff; border-radius: 4px; cursor: pointer; }
      button.secondary { background: #f7f7f7; color: #111; border-color: #ccc; }
      .status { color: #2a7a2a; font-size: 12px; }
      .hint { color: #666; font-size: 12px; margin-top: 4px; }
    </style>
  </head>
  <body>
    <h1>Broom — Options</h1>

    <label for="provider">LLM provider</label>
    <select id="provider">
      <option value="anthropic">Anthropic (Claude)</option>
    </select>

    <label for="model">Model</label>
    <input id="model" placeholder="claude-sonnet-4-6" />
    <div class="hint">Stored in chrome.storage.local. The content script never sees it.</div>

    <label for="apiKey">API key</label>
    <input id="apiKey" type="password" placeholder="sk-ant-…" />

    <div class="row">
      <button id="save">Save</button>
      <button id="export" class="secondary">Export rules</button>
      <button id="import" class="secondary">Import rules</button>
      <span class="status" id="status"></span>
    </div>

    <input id="importFile" type="file" accept="application/json" style="display:none" />

    <script type="module" src="options.js"></script>
  </body>
</html>
